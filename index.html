$("#main").innerHTML='<div class="card"><h2>Level 3: Misi Kasir Tiket Pensi 🎟️</h2><p>Harga tiket Rp30.000. Beli 4 tiket atau lebih, diskon 10%. Rancang otak robot kasir!</p>'+
'<h3>A. Input, proses, output</h3><div class="ipo"><b>Input</b>'+sel("i0",O)+'<b>Proses</b>'+sel("i1",O)+'<b>Output</b>'+sel("i2",O)+'</div><button class="btn" onclick="l3a()">Periksa A</button><div id="fa" class="fb"></div>'+
'<h3>B. Lengkapi pseudocode</h3><pre><span class="ln">START</span><span class="ln">INPUT jumlah</span><span class="ln">total = jumlah * '+sel("p0",["30000","jumlah","10%"])+'</span><span class="ln">IF jumlah '+sel("p1",[">",">=","<"])+' 4 THEN</span><span class="ln">    bayar = total * '+sel("p2",["0.1","0.9","1.1"])+'</span><span class="ln">ELSE</span><span class="ln">    bayar = '+sel("p3",["total","0","jumlah"])+'</span><span class="ln">ENDIF</span><span class="ln">OUTPUT '+sel("p4",["bayar","total","jumlah"])+'</span><span class="ln">END</span></pre><button class="btn" onclick="l3b()">Periksa B</button><div id="fb" class="fb"></div>'+
'<h3>C. Jalankan robot</h3><p>Coba berbagai jumlah tiket dan lihat langkah robot.</p><div class="row"><input id="n" type="number" min="0" value="4" aria-label="Jumlah tiket"><button class="pill on" onclick="l3run()">Jalankan</button></div><pre id="sim">Tekan Jalankan.</pre>'+
'<h3>D. Uji dengan data uji</h3><p>Hitung sendiri, lalu isi hasil yang harus dibayar (angka saja, dalam rupiah).</p><div class="ipo" style="grid-template-columns:120px 1fr"><b>3 tiket</b><input id="t3" type="number"><b>4 tiket</b><input id="t4" type="number"><b>5 tiket</b><input id="t5" type="number"></div><button class="btn" onclick="l3c()">Periksa D</button><div id="fc" class="fb"></div>'+
'<h3>Tantangan: kartu pelajar</h3><p>Jika membeli ≥ 4 tiket dan membawa kartu pelajar, diskon menjadi 20%. Berapa bayar untuk 4 tiket dengan kartu pelajar?</p><input id="tk" type="number"> <button class="pill on" onclick="l3t()">Cek</button><div id="ft" class="fb"></div></div>'}
function l3a(){var ok=[0,1,2].every(function(i){return $("#i"+i).value==O[i]});M.a=ok?1:0;msg("fa",ok,ok?"Tepat! Input, proses, dan output sudah benar.":"Belum tepat. Input adalah data masuk, proses adalah pengolahan, output adalah hasil.");c3()}
function l3b(){var k=["30000",">=","0.9","total","bayar"],ok=k.every(function(v,i){return $("#p"+i).value==v});M.b=ok?1:0;msg("fb",ok,ok?"Pseudocode benar! Bayar = 90% dari total jika jumlah ≥ 4.":"Ada bagian yang belum tepat. Ingat diskon 10% berarti murid membayar 90% dari total, dan data batas 4 ikut mendapat diskon.");c3()}
function calc(n){var t=n*30000;return n>=4?t*0.9:t}
function l3run(){var n=Number($("#n").value),t=n*30000,y=n>=4;$("#sim").innerHTML='<span class="ln">INPUT jumlah → '+n+'</span><span class="ln on">total = '+n+' * 30000 → '+t+'</span><span class="ln">IF '+n+' &gt;= 4 → '+(y?"YA":"TIDAK")+'</span><span class="ln on">bayar = '+(y?t+" * 0.9":t)+' → '+calc(n)+'</span><span class="ln">OUTPUT bayar → Rp'+calc(n).toLocaleString("id-ID")+'</span>'}
function num(id){return Number(String($("#"+id).value).replace(/\D/g,""))}
function l3c(){var ok=num("t3")==90000&&num("t4")==108000&&num("t5")==135000;M.c=ok?1:0;msg("fc",ok,ok?"Semua hasil cocok dengan robot! Data batas 4 tiket sudah kamu uji.":"Ada hasil yang belum cocok. Gunakan bagian C untuk memeriksa, lalu bandingkan dengan hitunganmu.");c3()}
function l3t(){var ok=num("tk")==96000;msg("ft",ok,ok?"Benar: 4 × 30000 = 120000, dikurangi 20%, jadi Rp96.000. Kamu siap untuk percabangan bertingkat!":"Belum tepat. Hitung total dulu, lalu bayar 80% dari total.")}
function c3(){if(M.a&&M.b&&M.c)win(2)}

/* LEVEL 4 */
var BL=["START","INPUT jumlah","total = jumlah + 30000","IF jumlah > 4 THEN","    bayar = total * 10%","ELSE","    bayar = total","ENDIF","OUTPUT total","END"],BUG=[2,3,4,8];
var FX={2:["total = jumlah * 30000","total = jumlah - 30000","total = jumlah / 30000"],3:["IF jumlah >= 4 THEN","IF jumlah < 4 THEN","IF jumlah = 4 THEN"],4:["bayar = total * 0.9","bayar = total * 10","bayar = total + 0.9"],8:["OUTPUT bayar","OUTPUT jumlah","OUTPUT 30000"]};
var FS={};BUG.forEach(function(b){FS[b]=shuf(FX[b])});
var M4={sus:[],found:false};
function v4(){
$("#main").innerHTML='<div class="card"><h2>Level 4: Debugging Battle 🐞</h2><p>Seorang kasir pemula menulis pseudocode ini. Untuk 5 tiket, hasil yang benar Rp135.000, tetapi robot menampilkan angka yang aneh. Ketuk baris yang menurutmu salah (ada 4 bug).</p>'+
'<pre>'+BL.map(function(t,i){var f=M4.found&&BUG.indexOf(i)>-1;return '<span class="ln tap '+(M4.sus.indexOf(i)>-1?"sus":"")+'" onclick="'+(M4.found?"":"l4tog("+i+")")+'">'+esc(t)+'</span>'}).join("")+'</pre>'+
(M4.found?'<h3>Pilih perbaikan untuk tiap bug</h3>'+BUG.map(function(b){return '<div class="q"><code>'+esc(BL[b])+'</code><br>'+sel("x"+b,FS[b])+'</div>'}).join("")+'<button class="btn" onclick="l4fix()">Periksa perbaikan</button>':'<button class="btn" onclick="l4find()">Periksa tersangka</button>')+'<div id="f4" class="fb"></div></div>'}
function l4tog(i){var k=M4.sus.indexOf(i);if(k>-1)M4.sus.splice(k,1);else M4.sus.push(i);v4()}
function l4find(){var hit=M4.sus.filter(function(i){return BUG.indexOf(i)>-1}).length,ext=M4.sus.length-hit;
if(hit==4&&ext==0){M4.found=true;v4();msg("f4",true,"Keempat bug ditemukan! Sekarang pilih perbaikan yang tepat.")}
else msg("f4",false,hit+" dari 4 bug sudah kamu tandai"+(ext?", dan "+ext+" baris yang kamu tandai sebenarnya benar":"")+". Telusuri dengan 5 tiket: hitung total, cek kondisi, lalu lihat apa yang ditampilkan.")}
function l4fix(){var ok=BUG.every(function(b){return $("#x"+b).value==FX[b][0]});
if(ok){msg("f4",true,"Semua bug sudah diperbaiki! Debugger andal. ⭐");win(3)}else msg("f4",false,"Masih ada perbaikan yang belum tepat. Uji ulang di kepalamu dengan 5 tiket dan 4 tiket.")}

/* PENUTUP */
function v5(){
$("#main").innerHTML='<div class="card"><h2>Penutup: Refleksi, Exit Ticket, dan Asesmen</h2><h3>Refleksi</h3>'+
["Apa yang paling menantang ketika membuat flowchart?","Mengapa urutan instruksi harus logis?","Bagaimana flowchart membantu kita menulis pseudocode?"].map(function(q,i){return '<p style="margin:10px 0 4px">'+q+'</p><textarea oninput="S.ref['+i+']=this.value;save()" aria-label="'+q+'">'+esc(S.ref[i]||"")+'</textarea>'}).join("")+
'<h3>Exit Ticket</h3><div class="q"><b>1.</b> Belah ketupat pada flowchart berfungsi sebagai…<br><label><input type="radio" name="e1" value="0"> Proses atau perhitungan</label><br><label><input type="radio" name="e1" value="1"> Keputusan dengan dua jalur YA dan TIDAK</label><br><label><input type="radio" name="e1" value="2"> Awal dan akhir algoritma</label></div>'+
'<div class="q"><b>2.</b> Manakah pseudocode yang benar: jika kehadiran ≥ 80 tampilkan “Boleh”, jika tidak “Tidak boleh”?<br><label><input type="radio" name="e2" value="0"> IF kehadiran &lt; 80 THEN OUTPUT “Boleh” ELSE OUTPUT “Tidak boleh” ENDIF</label><br><label><input type="radio" name="e2" value="1"> IF kehadiran &gt;= 80 THEN OUTPUT “Boleh” ELSE OUTPUT “Tidak boleh” ENDIF</label><br><label><input type="radio" name="e2" value="2"> IF kehadiran &gt;= 80 THEN OUTPUT “Boleh” ENDIF</label></div>'+
'<div class="q"><b>3.</b> Telusuri: jika saldo ≥ 20000 tampilkan “Cukup”, jika tidak “Kurang”.<br>saldo 20000 → '+sel("e3a",["Cukup","Kurang"])+'<br>saldo 15000 → '+sel("e3b",["Cukup","Kurang"])+'</div>'+
'<h3>Asesmen Pemahaman</h3><p>Bagian ini menguji penelusuran, simbol flowchart, debugging, dan kemampuan merancang pseudocode. Pilihan otomatis bernilai 5 poin; pseudocode dinilai guru dengan rubrik 4 poin.</p>'+
'<div class="q"><b>4. Uji data batas.</b> Jika pseudocode memeriksa <code>nilai &gt;= 75</code>, tentukan hasilnya.<br>Nilai 74 → '+sel("a74",["Tuntas","Belum Tuntas"],S.assessment.trace74,"saveAssessment(\'trace74\',this.value)")+'<br>Nilai 75 → '+sel("a75",["Tuntas","Belum Tuntas"],S.assessment.trace75,"saveAssessment(\'trace75\',this.value)")+'</div>'+
'<div class="q"><b>5. Pasangkan fungsi simbol.</b><br>INPUT nama → '+sel("asIn",["Belah ketupat","Jajar genjang","Persegi panjang"],S.assessment.symbolInput,"saveAssessment(\'symbolInput\',this.value)")+'<br>Keputusan “nilai ≥ 75?” → '+sel("asDecision",["Belah ketupat","Jajar genjang","Persegi panjang"],S.assessment.symbolDecision,"saveAssessment(\'symbolDecision\',this.value)")+'</div>'+
'<div class="q"><b>6. Temukan bug.</b> Pada aturan diskon tiket “diskon jika jumlah tiket 4 atau lebih”, apa perbaikan kondisi yang tepat?<br>'+sel("asBug",["jumlah > 4","jumlah >= 4","jumlah = 4"],S.assessment.bugCondition,"saveAssessment(\'bugCondition\',this.value)")+'</div>'+
'<p id="assessScore"><b>Skor otomatis: '+aScore(S.assessment)+' / 5</b></p>'+
'<div class="q"><b>7. Rancang pseudocode (dinilai guru, 0–4).</b> Harga satu buku Rp20.000. Jika membeli 3 buku atau lebih, diskon 15%; selain itu bayar harga normal. Tulis pseudocode dari INPUT sampai OUTPUT.<textarea oninput="saveAssessment(\'pseudocode\',this.value)" aria-label="Pseudocode diskon buku">'+esc(S.assessment.pseudocode||"")+'</textarea><small>Rubrik: 1 poin input dan total; 1 poin kondisi ≥ 3; 1 poin kedua jalur pembayaran (diskon 15% = bayar 85%); 1 poin output pembayaran.</small></div>'+
'<button class="btn" onclick="l5()">Periksa exit ticket</button><div id="f5" class="fb"></div>'+
'<h3>Hasil misimu</h3><div id="sum"></div><button class="pill on" onclick="cp()">Salin kode hasil (cadangan)</button><span id="cpm"></span></div>';sumr()}
function saveAssessment(key,value){S.assessment[key]=value;save();var e=$("#assessScore");if(e)e.innerHTML="<b>Skor otomatis: "+aScore(S.assessment)+" / 5</b>";if($("#sum"))sumr()}
function l5(){var r1=document.querySelector("input[name=e1]:checked"),r2=document.querySelector("input[name=e2]:checked");
var s=(r1&&r1.value=="1"?1:0)+(r2&&r2.value=="1"?1:0)+($("#e3a").value=="Cukup"&&$("#e3b").value=="Kurang"?1:0);
S.exit=s;save();if(s==3){msg("f5",true,"3 dari 3 benar. Kamu menguasai materi ini! ⭐");win(4)}
else if(s==2)msg("f5",false,"2 dari 3 benar. Cukup baik, perkuat bagian yang masih keliru lalu coba lagi.");
else msg("f5",false,s+" dari 3 benar. Ulangi Level 2 dan 3, lalu coba exit ticket lagi.");sumr()}
function stat(){var n=Object.keys(S.done).filter(function(k){return S.done[k]}).length;return (S.name||"Murid")+" ("+(S.className||"kelas belum diisi")+") menyelesaikan "+n+" dari 5 bintang: "+tabs.map(function(t,i){return t+" "+(S.done["l"+i]?"✔":"belum")}).join(", ")+"."}
function sumr(){var nm=(S.name||"").trim(),cl=(S.className||"").trim();$("#sum").innerHTML=nm&&cl?'<p>'+esc(stat())+'</p><p>Skor asesmen otomatis: <b>'+aScore(S.assessment)+' / 5</b>. Jawaban pseudocode akan dinilai guru (0–4) menggunakan rubrik di atas.</p><p><b>Hasil dikirim otomatis</b> jika LKPD sudah terhubung ke layanan online. Kode berikut bisa disalin sebagai cadangan jika pengiriman online belum tersedia.</p><textarea readonly rows="4" onclick="this.select()">'+kode()+'</textarea>':'<p class="fb bad">Isi nama lengkap dan kelas di bagian paling atas agar hasil dapat disimpan.</p>'}
function cp(){try{navigator.clipboard.writeText(kode()).then(function(){$("#cpm").textContent=" Tersalin."},function(){$("#cpm").textContent=" Gagal menyalin; foto layar saja."})}catch(e){$("#cpm").textContent=" Gagal menyalin; foto layar saja."}}

$("#nm").value=S.name||"";$("#nm").addEventListener("input",function(){S.name=this.value;save();if($("#sum"))sumr()});
$("#kelas").value=S.className||"";$("#kelas").addEventListener("input",function(){S.className=this.value;save();if($("#sum"))sumr()});
render();
push();
</script></body></html>
